<style>
:root{--ink:#111;--grey:#6b7280;--red:#d71f26;--soft:#eceef1;--line:#d9dce1}
*{box-sizing:border-box;margin:0}
html,body{background:#fff;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
@media (prefers-color-scheme:dark){html,body{background:#fff;color:#111}}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
.brand{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--grey);text-transform:uppercase}
.menu{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:700;cursor:pointer}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .4s}
h1{font-size:clamp(24px,4.4vw,40px);letter-spacing:-.5px;line-height:1.1;margin:4px 0 10px}
.kick{font-size:14px;letter-spacing:2px;font-weight:700;color:var(--red);text-transform:uppercase}
#stage svg{display:block;width:100%;height:auto;background:#fff;border:3px solid var(--ink);border-radius:16px}
#stage text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#stage [data-s],#stage [data-e],#stage [data-c],#stage [data-p]{transition:opacity .55s,transform .9s ease}
#stage rect,#stage text,#stage path,#stage circle{transition:fill .4s,stroke .4s,opacity .55s}
#stage .off{opacity:0!important;pointer-events:none}
#stage .dim{opacity:.28}
#stage .hot rect,#stage rect.hot{stroke:var(--red)!important}
#stage .hot text{fill:var(--red)!important}
#stage .hot path{stroke:var(--red)!important}
#stage .notrans,#stage .notrans *{transition:none!important}
#narr{margin-top:14px;border-left:6px solid var(--red);padding:6px 0 6px 16px;min-height:96px}
#narr .lab{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--grey);text-transform:uppercase;margin-bottom:4px}
#narr p{font-size:clamp(19px,2.6vw,25px);line-height:1.38}
#say{margin-top:12px;background:#fff4f4;border:3px solid var(--red);border-radius:14px;padding:10px 16px}
#say .lab{font-size:13px;letter-spacing:2px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:4px}
#say p{font-size:clamp(20px,2.8vw,27px);line-height:1.35;font-weight:700}
#say.off{display:none}
#aud{margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff}
#aud summary{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--grey)}
#aud div.r{font-size:clamp(16px,2.2vw,20px);line-height:1.35;margin:8px 0}
#aud b{display:inline-block;min-width:92px;color:var(--red)}
.ctl{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:10px 22px;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink)}
.btn.main{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px;flex:1;justify-content:center;flex-wrap:wrap}
.dots b{width:14px;height:14px;border-radius:7px;background:var(--line);cursor:pointer;display:block}
.dots b.on{background:var(--red)}.dots b.done{background:var(--ink)}
#drawer{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;overflow:auto;padding:24px 16px;z-index:9}
#drawer.open{display:block}
#drawer .in{max-width:640px;margin:0 auto}
#drawer button{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:19px;cursor:pointer}
#drawer button.cur{border-color:var(--red);font-weight:700}
.card{border:3px solid var(--ink);border-radius:16px;padding:22px 22px}
.card h2{font-size:clamp(22px,3.4vw,32px);margin-bottom:10px}
.card p,.card li{font-size:clamp(18px,2.4vw,23px);line-height:1.4;margin:8px 0}
.card ol{padding-left:26px}
.q{border:3px solid var(--ink);border-radius:16px;padding:18px;margin:14px 0}
.q .cue{font-size:clamp(20px,2.8vw,28px);font-weight:700;margin-bottom:10px}
.q .opt{display:block;width:100%;text-align:left;border:3px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:clamp(17px,2.3vw,22px);cursor:pointer}
.q .opt.right{border-color:#111;background:#111;color:#fff}
.q .opt.wrong{border-color:var(--red);color:var(--red)}
.q .why{font-size:clamp(16px,2.2vw,21px);margin-top:8px;color:var(--grey);display:none}
.q.done .why{display:block}
.score{font-size:30px;font-weight:700;color:var(--red);margin-top:10px}
</style></head><body>

<script>
const PY = [{"title": "Start here: a model is learned numbers", "narr": ["A small support team gets a ticket: \"I was charged twice!\" The team wants the app to pick a priority.", "The tool for that is a model. A model is a file of learned numbers (called weights). It is not a person and it does not think.", "The numbers come from training. The team shows the model old tickets with the right answers, and training adjusts the numbers until its answers match.", "Training happens once, before use. The result is the finished model.", "Now a new ticket arrives. The model turns it into an answer: priority high. Using a finished model is called inference.", "The same team wants a drafted reply too. That is a different job, done by a language model that someone else already trained.", "Training from nothing is a big project. Starting from a model someone else trained is often enough. Next problem: the model has never seen this month's policy."], "say": ["A support team gets a ticket: I was charged twice. They want the app to pick a priority.", "The tool is a model: a file of learned numbers. It does not think.", "They showed it old tickets with right answers. Training adjusted the numbers until its answers matched.", "That happened once, before anyone used it. The result is the finished model.", "A new ticket arrives and the model answers: priority high. Using a finished model is inference.", "They also want a drafted reply. That is a language model somebody else already trained.", "Training from nothing is a big project. Start from a model someone trained for you. Next problem: the model has never seen this month's policy."], "aud": {"exec": "Two jobs, two kinds of model: one predicts a label, one writes text. You can usually reuse a trained one.", "sec": "A model is a file plus data it was trained on. Training data and the model both need an owner and access rules.", "ops": "Training and inference are separate workloads with separate cost and compute. Plan them separately."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"110\" width=\"311\" height=\"52\" rx=\"18\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"185.5\" y=\"140\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">\"I was charged twice!\"</text></g><g><rect x=\"70\" y=\"190\" width=\"90\" height=\"120\" rx=\"6\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><path d=\"M82 212 H148\" stroke=\"#6b7280\" stroke-width=\"3\"/><path d=\"M82 232 H148\" stroke=\"#6b7280\" stroke-width=\"3\"/><path d=\"M82 252 H148\" stroke=\"#6b7280\" stroke-width=\"3\"/></g><text x=\"115\" y=\"340\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">A ticket</text></g><g data-s=\"1\"><path d=\"M170 255 L380 255\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"380\" y=\"190\" width=\"200\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"253.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">A model</text><text x=\"480.0\" y=\"283.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">learned numbers</text></g></g><g data-s=\"2\"><g><rect x=\"60\" y=\"410\" width=\"230\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"175.0\" y=\"458.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Old tickets</text><text x=\"175.0\" y=\"488.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">with right answers</text></g><path d=\"M290 460 L410 460\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"410\" y=\"410\" width=\"230\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"525.0\" y=\"458.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Training</text><text x=\"525.0\" y=\"488.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">adjusts the numbers</text></g><path d=\"M500 410 L480 322\" stroke=\"#d71f26\" stroke-width=\"5\" fill=\"none\" marker-end=\"url(#ahr)\"/></g><g data-s=\"3\"><g><rect x=\"300\" y=\"362\" width=\"142\" height=\"36\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"371.0\" y=\"385\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">done once</text></g></g><g data-s=\"4\"><g><rect x=\"210\" y=\"205\" width=\"132\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"276.0\" y=\"226\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">inference</text></g><path d=\"M580 255 L740 255\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"740\" y=\"190\" width=\"190\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"835.0\" y=\"253.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Answer</text><text x=\"835.0\" y=\"283.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">priority: high</text></g></g><g data-s=\"5\"><g><rect x=\"700\" y=\"350\" width=\"230\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"815.0\" y=\"403.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Language model</text><text x=\"815.0\" y=\"433.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">trained by others</text></g><path d=\"M580 300 L700 375\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ahg)\"/></g><text x=\"480\" y=\"558\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"6\">You can start from a model someone else trained.</text>"}, {"title": "Three ways to change what a model says", "narr": ["A customer asks about the return window. The model's numbers are fixed. It was never shown this month's policy.", "The return policy changes every month. It lives in a document, not in the model.", "The simple fix is to paste the relevant policy text into the request. The model reads it and answers from it. When a program finds and pastes the text for you, that is retrieval (RAG).", "Nothing inside the model changed. The policy shaped this one answer only.", "A different problem: the team wants every reply in one house format. For that you can fine-tune: train the model a little more on reviewed examples. This changes its numbers.", "Match the tool to the problem. A changing fact calls for retrieval. A repeated style or format may call for fine-tuning. Measure against a baseline, because fine-tuning is not guaranteed to help. Next problem: the app calls an API, but who runs the model behind it?"], "say": ["A customer asks about the return window. The model never saw this month's policy.", "The policy changes every month. It lives in a document, not in the model.", "So a program pastes the right policy text into the request. That is retrieval.", "The model's numbers did not change. The policy shaped this one answer.", "Now the team wants one house format. They train the model a little more on reviewed replies. That is fine-tuning.", "Changing fact: retrieve it. Repeated habit: maybe fine-tune. Test before you trust either. Next problem: the app calls an API, but who runs the model behind it?"], "aud": {"exec": "Cheapest first: try the model as it is, then add retrieval for facts. Fine-tuning is a later, measured step.", "sec": "Retrieval does not teach the model, and it does not enforce who may see a document. Permissions are separate.", "ops": "Fine-tuning needs good examples and a separate test set. It can add training and hosting charges."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"90\" width=\"384\" height=\"52\" rx=\"18\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"222.0\" y=\"120\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">\"What is the return window?\"</text></g><g><rect x=\"40\" y=\"200\" width=\"230\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"155.0\" y=\"258.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">The model</text><text x=\"155.0\" y=\"288.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">numbers fixed</text></g></g><g data-s=\"1\"><g><rect x=\"780\" y=\"190\" width=\"90\" height=\"120\" rx=\"6\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><path d=\"M792 212 H858\" stroke=\"#6b7280\" stroke-width=\"3\"/><path d=\"M792 232 H858\" stroke=\"#6b7280\" stroke-width=\"3\"/><path d=\"M792 252 H858\" stroke=\"#6b7280\" stroke-width=\"3\"/></g><text x=\"825\" y=\"340\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Return policy</text><g><rect x=\"730\" y=\"130\" width=\"204\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"832.0\" y=\"151\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">changes monthly</text></g></g><g data-s=\"2\"><path d=\"M270 260 L330 260\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><rect x=\"330\" y=\"200\" width=\"330\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"495\" y=\"245\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">The request</text><text x=\"495\" y=\"282\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">question + policy text</text><path d=\"M780 255 L660 255\" stroke=\"#d71f26\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ahr)\"/></g><g data-s=\"3\"><g><rect x=\"60\" y=\"340\" width=\"228\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"174.0\" y=\"361\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">numbers unchanged</text></g></g><g data-s=\"4\"><g><rect x=\"30\" y=\"400\" width=\"250\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"155.0\" y=\"448.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Reviewed replies</text><text x=\"155.0\" y=\"478.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">examples</text></g><path d=\"M280 450 L330 450\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"330\" y=\"400\" width=\"260\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"460.0\" y=\"448.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Fine-tuning</text><text x=\"460.0\" y=\"478.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">changes the numbers</text></g><path d=\"M590 450 L650 450\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"650\" y=\"400\" width=\"280\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"790.0\" y=\"448.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">A new model</text><text x=\"790.0\" y=\"478.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">answers in our format</text></g></g><text x=\"480\" y=\"558\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Fresh facts: retrieval. Fixed habits: fine-tuning. Test both.</text>"}, {"title": "\"Via API\" does not say who runs the model", "narr": ["A developer's app calls an API and gets an answer. That feels simple. An API is only the doorway.", "Four words matter. The model is the learned file. A deployment makes it available. The endpoint is the address you call. The runtime is the software that loads and runs it.", "Behind the doorway, someone has to run all this. It could be Microsoft, a partner, or your own team.", "From the app, all three look alike. The API alone does not tell you who operates the model.", "Even when someone else runs it, your team still owns the app, the model choice, the tests, access, and the review of where data goes. Next problem: where do these things sit in Azure?"], "say": ["A developer's app calls an API and gets an answer. The API is only the doorway.", "Four words. Model: the file. Deployment: makes it available. Endpoint: the address. Runtime: the software that runs it.", "Someone has to run all that. It could be Microsoft, a partner, or your own team.", "From the app, all three look the same. So an API tells you nothing about who runs it.", "Even when someone else runs it, you still own the app, the tests, the access and the data review. Next problem: where do these things sit in Azure?"], "aud": {"exec": "Never accept \"it is just an API\" as an answer to who is responsible. Ask who operates the model.", "sec": "Operator decides data handling, terms and support. Check them per model, not per platform.", "ops": "Record model name and version, deployment type, endpoint, and the owner for each."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"190\" width=\"190\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"125.0\" y=\"243.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Your app</text><text x=\"125.0\" y=\"273.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">calls an API</text></g><path d=\"M220 245 L330 245\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"330\" y=\"190\" width=\"200\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"430.0\" y=\"243.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Endpoint</text><text x=\"430.0\" y=\"273.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">the address</text></g></g><g data-s=\"1\"><g><rect x=\"30\" y=\"440\" width=\"210\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"135.0\" y=\"483.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Model</text><text x=\"135.0\" y=\"513.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">the learned file</text></g><g><rect x=\"260\" y=\"440\" width=\"210\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"365.0\" y=\"483.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Deployment</text><text x=\"365.0\" y=\"513.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">makes it callable</text></g><g><rect x=\"490\" y=\"440\" width=\"210\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"595.0\" y=\"483.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Endpoint</text><text x=\"595.0\" y=\"513.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">what you call</text></g><g><rect x=\"720\" y=\"440\" width=\"210\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"825.0\" y=\"483.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Runtime</text><text x=\"825.0\" y=\"513.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">loads and runs it</text></g></g><g data-s=\"2\"><g><rect x=\"640\" y=\"100\" width=\"290\" height=\"66\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"142.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Microsoft runs it</text></g><g><rect x=\"640\" y=\"190\" width=\"290\" height=\"66\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"232.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">A partner runs it</text></g><g><rect x=\"640\" y=\"280\" width=\"290\" height=\"66\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"322.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Your team runs it</text></g><path d=\"M530 230 L640 133\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ahg)\"/><path d=\"M530 245 L640 223\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ahg)\"/><path d=\"M530 260 L640 313\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ahg)\"/></g><g data-s=\"3\"><text x=\"280\" y=\"340\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">The API looks the same in all three.</text></g><g data-s=\"4\"><rect x=\"30\" y=\"365\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"400\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">You still own: app, model choice, tests, access, data review</text></g>"}, {"title": "Where everything lives in Azure", "narr": ["Where does all this sit in Azure? Start from the outside. A tenant is the directory of people and programs your organisation owns.", "Inside it sits a subscription. It is where Azure tracks who may manage resources and what they cost.", "Inside that, a resource group holds related things. You group what you will manage and retire together.", "The things themselves are resources: a Foundry resource, a machine learning workspace, a storage account.", "A Foundry project is a working space inside the Foundry resource. The ML workspace is a separate resource beside it, not under the project.", "Two resources in one group do not automatically share access. Each one needs its own roles.", "A subscription is a bill and an access boundary. You do not need a subscription per model. Next problem: you want a model without running any machines."], "say": ["Where does it all sit? Start outside. A tenant is the directory of people and programs you own.", "Inside it sits a subscription. Azure tracks access and cost there.", "Inside that, a resource group holds things you manage and retire together.", "The things are resources: a Foundry resource, a machine learning workspace, storage.", "A project lives inside the Foundry resource. The ML workspace sits beside it, not under it.", "Same group does not mean shared access. Each resource needs its own roles.", "A subscription is a bill and a boundary. It does not hold a model, and you do not need one per model. Next problem: you want a model without running any machines."], "aud": {"exec": "A subscription is cost and access. A typical split is one for development and one for production.", "sec": "Access is per resource. Putting two resources in one group grants nothing by itself.", "ops": "Group by lifecycle. A resource group can span regions, so its location does not decide where things run."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><rect x=\"30\" y=\"70\" width=\"900\" height=\"460\" rx=\"16\" fill=\"#fff\" stroke=\"#6b7280\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"52\" y=\"106\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"700\">Tenant: the directory that knows who you are</text></g><g data-s=\"1\"><rect x=\"60\" y=\"125\" width=\"840\" height=\"380\" rx=\"16\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"82\" y=\"160\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Subscription: access and cost are tracked here</text></g><g data-s=\"2\"><rect x=\"90\" y=\"180\" width=\"780\" height=\"305\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/><text x=\"112\" y=\"214\" font-size=\"21\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Resource group: things you manage and retire together</text></g><g data-s=\"3\"><g><rect x=\"120\" y=\"235\" width=\"230\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"235.0\" y=\"278.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Foundry</text><text x=\"235.0\" y=\"308.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a resource</text></g><g><rect x=\"380\" y=\"235\" width=\"230\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"495.0\" y=\"278.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">ML workspace</text><text x=\"495.0\" y=\"308.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a resource</text></g><g><rect x=\"640\" y=\"235\" width=\"200\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"740.0\" y=\"278.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Storage</text><text x=\"740.0\" y=\"308.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a resource</text></g></g><g data-s=\"4\"><rect x=\"135\" y=\"340\" width=\"200\" height=\"52\" rx=\"10\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"3\"/><text x=\"235\" y=\"374\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Project inside</text></g><g data-s=\"5\"><text x=\"480\" y=\"435\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Same group does not mean shared access. Set roles.</text></g><text x=\"480\" y=\"558\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"6\">A subscription holds resources. It holds no model.</text>"}, {"title": "Models as a service: someone else runs the GPUs", "narr": ["A team wants a model without running any machines. The simplest path in Foundry is the Serverless API.", "Microsoft hosts the model and the machines behind that API.", "You do not buy GPUs and you do not patch the runtime. You still choose the model, write the tests, control access and watch cost.", "Models sold by Azure are billed through Azure and have Microsoft support under the service terms.", "Partner and community models can come with different licence terms, billing, support and data handling. The same doorway does not mean the same contract. Next problem: a rule says where your data may be processed."], "say": ["A team wants a model and no machines to run. The simple path is Foundry's serverless API.", "Microsoft hosts the model and the machines behind it.", "No GPUs to buy and no runtime to patch. Tests, access and cost are still on you.", "A model sold by Azure is billed through Azure, with Microsoft support.", "A partner model can carry other terms, billing and support. Same doorway, different contract. Read the model card. Next problem: a rule says where your data may be processed."], "aud": {"exec": "Fastest path to a working feature, with the least infrastructure to run.", "sec": "Treat each model's publisher terms and data handling as a separate review. Evaluate output quality before customer use.", "ops": "Record model, version, deployment type, quota and budget per deployment. Public prices are estimates, not your agreement."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"190\" width=\"200\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"130.0\" y=\"259.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Your app</text></g><path d=\"M230 250 L330 250\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"330\" y=\"190\" width=\"260\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"460.0\" y=\"248.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Serverless API</text><text x=\"460.0\" y=\"278.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">in Foundry</text></g><path d=\"M590 250 L690 250\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"690\" y=\"190\" width=\"240\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"810.0\" y=\"248.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">The model</text><text x=\"810.0\" y=\"278.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">on their GPUs</text></g></g><g data-s=\"1\"><g><rect x=\"600\" y=\"135\" width=\"261\" height=\"36\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"730.5\" y=\"158\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Microsoft hosts it</text></g></g><g data-s=\"2\"><g><rect x=\"30\" y=\"335\" width=\"465\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"262.5\" y=\"357\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">no GPUs to buy, no runtime to patch</text></g></g><g data-s=\"3\"><rect x=\"30\" y=\"395\" width=\"440\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"250\" y=\"435\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Sold by Azure</text><text x=\"250\" y=\"475\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">Azure meters, Microsoft support</text><text x=\"250\" y=\"505\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">and service terms</text></g><g data-s=\"4\"><rect x=\"490\" y=\"395\" width=\"440\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"710\" y=\"435\" font-size=\"26\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Partner or community</text><text x=\"710\" y=\"475\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">Own terms, billing and support</text><text x=\"710\" y=\"505\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">Read the model card</text></g>"}, {"title": "Deployment type: where is your data processed?", "narr": ["Same model, different rules. Suppose legal says customer data must stay in the EU. That is the question a deployment type answers.", "Three options bill by the token. Global Standard may process in any Azure region. Data Zone Standard stays in one zone such as the EU. Standard stays in one geography.", "Provisioned throughput reserves capacity, counted in PTUs. It suits steady, high volume and costs the same whether busy or idle.", "Batch takes bulk work and returns it later, aiming for 24 hours. It has no real-time promise.", "Developer is a short test deployment for fine-tuned models. It has no data-residency guarantee and no SLA, so it is not for production.", "For the EU rule, Data Zone Standard or Standard are the candidates. Global is out.", "Where the resource sits is not where requests are processed. The deployment type decides that. Next problem: you want an open model, not a vendor one."], "say": ["Legal says customer data must stay in the EU. A deployment type answers that.", "Three bill per token. Global may process anywhere. Data Zone stays in one zone. Standard stays in one geography.", "Provisioned reserves capacity. Good for steady high volume. You pay for it busy or idle.", "Batch returns big jobs later, aiming for a day. No real-time promise.", "Developer is a short test only. No residency guarantee and no SLA.", "For the EU rule, Data Zone or Standard. Global is out.", "Where the resource sits is not where requests run. The deployment type decides that. Next problem: you want an open model, not a vendor one."], "aud": {"exec": "One legal rule picks the deployment type. Billing is a separate choice: per token, reserved, or bulk.", "sec": "Data at rest stays in the chosen geography. Where inference runs is a different question: check the type.", "ops": "Not every model supports every type. Treat the portal's list as part of model selection."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><rect x=\"30\" y=\"75\" width=\"900\" height=\"58\" rx=\"12\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"480\" y=\"112\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">A rule from legal: customer data must stay in the EU</text></g><g data-s=\"1\"><rect x=\"30\" y=\"150\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"185\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Global Standard</text><text x=\"330\" y=\"185\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">any Azure region</text><text x=\"700\" y=\"185\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">per token</text></g><g data-s=\"1\"><rect x=\"30\" y=\"212\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"247\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Data Zone Standard</text><text x=\"330\" y=\"247\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">stays in one data zone</text><text x=\"700\" y=\"247\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">per token</text></g><g data-s=\"1\"><rect x=\"30\" y=\"274\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"309\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Standard</text><text x=\"330\" y=\"309\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">stays in one geography</text><text x=\"700\" y=\"309\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">per token</text></g><g data-s=\"2\"><rect x=\"30\" y=\"336\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"371\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Provisioned</text><text x=\"330\" y=\"371\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">reserved capacity (PTUs)</text><text x=\"700\" y=\"371\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">steady cost</text></g><g data-s=\"3\"><rect x=\"30\" y=\"398\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"433\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Batch</text><text x=\"330\" y=\"433\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">bulk jobs, within 24 hours</text><text x=\"700\" y=\"433\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">async</text></g><g data-s=\"4\"><rect x=\"30\" y=\"460\" width=\"900\" height=\"54\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"495\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Developer</text><text x=\"330\" y=\"495\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">trying fine-tuned models</text><text x=\"700\" y=\"495\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">no SLA</text></g><g data-s=\"5\"><rect x=\"24\" y=\"206\" width=\"912\" height=\"66\" rx=\"14\" fill=\"none\" stroke=\"#d71f26\" stroke-width=\"6\"/><rect x=\"24\" y=\"268\" width=\"912\" height=\"66\" rx=\"14\" fill=\"none\" stroke=\"#d71f26\" stroke-width=\"6\"/></g><g data-s=\"6\"><text x=\"480\" y=\"570\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">The region of the resource alone does not say where it runs.</text></g>"}, {"title": "Open-weight models: Fireworks on Foundry", "narr": ["A team wants an open-weight model without running GPUs. Fireworks on Foundry offers that through a Foundry project.", "It serves selected open-weight models. It can also host weights you bring, including ones you already fine-tuned.", "The boundaries matter. The runtime and GPUs are Fireworks'. Data is shared with them. It is outside the EU Data Boundary commitments, it has no FedRAMP, and PCI DSS does not apply. Microsoft does not test these models for safety.", "The integration is generally available. Some parts are not: LoRA adapters, and deploying a model fine-tuned in Foundry through Fireworks, are Preview. Preview means no SLA and not recommended for production.", "An administrator must switch the feature on before anyone can deploy.", "So the check is yours: does the data handling and the model suit your rules? Next problem: the model is only one part of the app."], "say": ["A team wants an open-weight model and no GPUs to run. Fireworks on Foundry is one way.", "It serves chosen open models. It can also host weights you bring.", "The runtime is Fireworks'. Data is shared with them, it is outside the EU Data Boundary, and Microsoft does not test these models for safety.", "The integration is generally available. LoRA adapters and Foundry fine-tuned deploys are Preview.", "An administrator has to switch it on first.", "The check is yours. Does the data handling and the model fit your rules? Next problem: the model is only one part of the app."], "aud": {"exec": "A convenient path to open models, with a different data and safety boundary from Microsoft-hosted models.", "sec": "Partner data handling is a separate review. No FedRAMP, outside EU Data Boundary, no Microsoft safety evaluation of the model.", "ops": "Admin enables the feature in the portal. Preview features have no SLA and are not recommended for production."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"100\" width=\"300\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"180.0\" y=\"164.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Foundry project</text></g><path d=\"M330 155 L410 155\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"410\" y=\"100\" width=\"300\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"560.0\" y=\"153.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Fireworks runtime</text><text x=\"560.0\" y=\"183.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">their GPUs, their service</text></g></g><g data-s=\"1\"><text x=\"735\" y=\"130\" font-size=\"21\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\"><tspan x=\"735\" dy=\"0\">open-weight models,</tspan><tspan x=\"735\" dy=\"30\">or weights you</tspan><tspan x=\"735\" dy=\"30\">bring yourself</tspan></text></g><g data-s=\"2\"><rect x=\"30\" y=\"240\" width=\"900\" height=\"190\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"50\" y=\"278\" font-size=\"23\" fill=\"#d71f26\" text-anchor=\"start\" font-weight=\"700\">What to check first:</text><text x=\"50\" y=\"316\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\"><tspan x=\"50\" dy=\"0\">Data is shared between Microsoft and Fireworks</tspan><tspan x=\"50\" dy=\"33\">Outside the EU Data Boundary commitments</tspan><tspan x=\"50\" dy=\"33\">No FedRAMP; PCI DSS does not apply</tspan><tspan x=\"50\" dy=\"33\">Microsoft does not test the safety of these models</tspan></text></g><g data-s=\"3\"><rect x=\"30\" y=\"445\" width=\"900\" height=\"76\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"477\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"480\" dy=\"0\">Generally available: the integration itself</tspan><tspan x=\"480\" dy=\"32\">Preview: LoRA adapters, and Foundry fine-tuned models on Fireworks</tspan></text></g><g data-s=\"4\"><text x=\"480\" y=\"550\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">An administrator must switch it on before anyone can deploy.</text></g><text x=\"480\" y=\"585\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Review data handling before you pick it.</text>"}, {"title": "A model is one part of an app", "narr": ["A user asks the app a question. The app passes it to a model. That is the smallest version.", "For private or current facts the app first asks a search service. Azure AI Search finds the relevant passages and hands them to the model.", "It can search by keywords and by meaning (vectors). A hybrid query uses both, which helps when a user words a question differently from the document.", "Before the answer reaches the user, a safety check can screen it. Azure AI Content Safety moderates text and images, and Prompt Shields look for attacks hidden in prompts and documents.", "Search finds text. It does not decide who may read it. Permissions must be enforced separately.", "Two watch items. Agentic retrieval (a model plans several searches) is Preview. Several Content Safety preview features retire on 30 April 2027. Next problem: do you need an agent at all?"], "say": ["A user asks a question. The app passes it to a model. That is the smallest version.", "For private or current facts, the app asks a search service first. It hands the passages to the model.", "Search by keyword and by meaning together. That helps when people word things differently.", "Before the answer goes out, a safety check screens it. Prompt Shields look for hidden attacks.", "Search finds text. It does not decide who may read it. I enforce that separately.", "Two watch items. Agentic retrieval is Preview. Some Content Safety previews retire 30 April 2027. Next problem: do you need an agent at all?"], "aud": {"exec": "A good answer needs the model plus the right facts plus checks. The model alone is a small part.", "sec": "Prompt Shields do not judge accuracy. Retrieval does not replace authorization or human review for high-impact decisions.", "ops": "Decide chunking, update schedule, searchable fields and permissions. Trace the whole request, not only token counts."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><circle cx=\"70\" cy=\"225\" r=\"22\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><path d=\"M34 299 a36 36 0 0 1 72 0 z\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"70\" y=\"339\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">User</text></g><path d=\"M130 250 L250 250\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"250\" y=\"190\" width=\"200\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"350.0\" y=\"259.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Your app</text></g><path d=\"M450 250 L570 250\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"570\" y=\"190\" width=\"180\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"660.0\" y=\"259.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">The model</text></g></g><g data-s=\"1\"><g><rect x=\"220\" y=\"400\" width=\"260\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"350.0\" y=\"448.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Azure AI Search</text><text x=\"350.0\" y=\"478.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">finds the right text</text></g><path d=\"M350 400 L350 312\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/></g><g data-s=\"2\"><g><rect x=\"510\" y=\"430\" width=\"339\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"679.5\" y=\"452\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">keyword + vector (hybrid)</text></g></g><g data-s=\"3\"><path d=\"M750 250 L790 250\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><rect x=\"790\" y=\"190\" width=\"140\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\"/><text x=\"860\" y=\"240\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Safety</text><text x=\"860\" y=\"272\" font-size=\"18\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">screens output</text></g><g data-s=\"4\"><text x=\"480\" y=\"540\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Retrieval is not authorization. Enforce who may see what.</text></g><g data-s=\"5\"><g><rect x=\"30\" y=\"100\" width=\"351\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"205.5\" y=\"122\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Preview: agentic retrieval</text></g><g><rect x=\"30\" y=\"140\" width=\"553\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"306.5\" y=\"162\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Content Safety previews retire 30 Apr 2027</text></g></g>"}, {"title": "Agent or plain code? And task APIs", "narr": ["Does the task need an agent at all? If the steps are known in advance, use ordinary code or a fixed workflow. If the task is open-ended and the model must choose tools, an agent fits.", "Foundry Agent Service runs two kinds. A prompt agent keeps its instructions and tools inside Foundry. A hosted agent is your own container, with Foundry managing endpoint, scaling and identity.", "Microsoft Agent Framework is a code library for building agents and workflows. Microsoft calls it the direct successor to Semantic Kernel and AutoGen.", "Two cautions. Go support in Agent Framework is public preview. Prompt Flow is no longer recommended for new work and retires on 20 April 2027.", "Not every feature needs a language model. Azure has task APIs for speech, images, documents, text, translation and video.", "Pick the service by the job, then test it on your own data. A focused API can be simpler to evaluate than a general model. Next problem: you want to own the model, not rent it."], "say": ["Does the job need an agent? Known steps mean ordinary code. An open-ended task means an agent.", "A prompt agent keeps its instructions in Foundry. A hosted agent is your container, and Foundry runs it.", "Agent Framework is the code library. Microsoft calls it the successor to Semantic Kernel and AutoGen.", "Go support is preview. Prompt Flow retires on 20 April 2027, so do not start new work on it.", "Some jobs need no language model. There are task APIs for speech, images, documents, text, translation and video.", "Pick the service by the job. Test it on your own data. Next problem: you want to own the model, not rent it."], "aud": {"exec": "Do not add an agent to a process just because you can. An agent earns its place on open-ended tasks.", "sec": "Decide which tools an agent may call and which data it may fetch. Managed runtime does not decide that for you.", "ops": "Check Preview and retirement notices before choosing. Agent Framework status varies by language."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"120\" width=\"420\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"240.0\" y=\"183.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Steps known in advance</text><text x=\"240.0\" y=\"213.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">plain code or a workflow</text></g><g><rect x=\"510\" y=\"120\" width=\"420\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"720.0\" y=\"183.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Open-ended task</text><text x=\"720.0\" y=\"213.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">an agent picks the tools</text></g></g><g data-s=\"1\"><g><rect x=\"30\" y=\"300\" width=\"420\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"240.0\" y=\"358.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Prompt agent</text><text x=\"240.0\" y=\"388.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">instructions + tools in Foundry</text></g><g><rect x=\"510\" y=\"300\" width=\"420\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"720.0\" y=\"358.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Hosted agent</text><text x=\"720.0\" y=\"388.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">your container, Foundry runs it</text></g></g><g data-s=\"2\"><rect x=\"30\" y=\"450\" width=\"900\" height=\"70\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"493\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Agent Framework: the successor to Semantic Kernel and AutoGen</text></g><g data-s=\"3\"><g><rect x=\"30\" y=\"540\" width=\"336\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"198.0\" y=\"561\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Go support: public preview</text></g><g><rect x=\"420\" y=\"540\" width=\"396\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"618.0\" y=\"561\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Prompt Flow retires 20 Apr 2027</text></g></g><g data-s=\"4\" data-e=\"6\"><rect x=\"0\" y=\"60\" width=\"960\" height=\"540\" rx=\"0\" fill=\"#fff\" stroke=\"#fff\" stroke-width=\"0\"/><text x=\"480\" y=\"100\" font-size=\"28\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Not every job needs a language model</text></g><g data-s=\"4\" data-e=\"6\"><g><rect x=\"30\" y=\"140\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"175.0\" y=\"183.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Speech</text><text x=\"175.0\" y=\"213.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">speech to text and back</text></g><g><rect x=\"335\" y=\"140\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"183.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Vision</text><text x=\"480.0\" y=\"213.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">read images</text></g><g><rect x=\"640\" y=\"140\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"183.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Documents</text><text x=\"785.0\" y=\"213.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">Document Intelligence</text></g></g><g data-s=\"4\" data-e=\"6\"><g><rect x=\"30\" y=\"260\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"175.0\" y=\"303.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Language</text><text x=\"175.0\" y=\"333.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">classify text</text></g><g><rect x=\"335\" y=\"260\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"303.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Translator</text><text x=\"480.0\" y=\"333.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">between languages</text></g><g><rect x=\"640\" y=\"260\" width=\"290\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"303.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Video Indexer</text><text x=\"785.0\" y=\"333.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">insights from video</text></g></g><text x=\"480\" y=\"420\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Pick the service by the job.</text>"}, {"title": "Own the model: Azure Machine Learning", "narr": ["A team wants to own a ticket-priority model. Azure Machine Learning is the place to organise that work. It starts with labelled data: past tickets with the right priority.", "Split the data. Fit on one part, tune on another, and keep a final test part the model never sees. A high score on the data it trained on proves little.", "A training job runs your code, in a chosen environment, on chosen compute. Then you compare the result with a baseline and register the winning model as a version.", "If it is not good enough, it goes back for more work. It does not go into production.", "Only then deploy. An online endpoint answers requests over HTTPS while a user waits. A batch endpoint processes large files later. A job, a registered model and an endpoint are three different things. Next problem: other managed routes sit between renting and owning."], "say": ["A team wants to own a priority model. Azure Machine Learning organises that work. It starts with labelled tickets.", "They split the data and keep a test part the model never sees. A high score on training data proves little.", "A training job runs their code on chosen compute. They compare against a baseline and register the winner as a version.", "If it is not good enough, it goes back for more work. It does not ship.", "Then they deploy. Online answers now. Batch answers later. Job, model and endpoint are three different things. Next problem: other managed routes sit between renting and owning."], "aud": {"exec": "Own the model only if a hosted one cannot do the job. It means data, training, versions and upkeep.", "sec": "Record data, code, environment and results for each version, so a deployment can be traced to its run.", "ops": "MLflow tracks experiments. Plan how you will spot quality dropping and when you will retrain."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"100\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"165.0\" y=\"148.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Labelled data</text><text x=\"165.0\" y=\"178.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">tickets with priorities</text></g><path d=\"M300 150 L345 150\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"345\" y=\"100\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"148.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Split it</text><text x=\"480.0\" y=\"178.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">train, check, test</text></g><path d=\"M615 150 L660 150\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"660\" y=\"100\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"795.0\" y=\"148.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Training job</text><text x=\"795.0\" y=\"178.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">code + compute</text></g></g><g data-s=\"1\"><g><rect x=\"345\" y=\"208\" width=\"312\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"501.0\" y=\"229\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">keep the test set unseen</text></g></g><g data-s=\"2\"><g><rect x=\"30\" y=\"280\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"165.0\" y=\"328.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Compare</text><text x=\"165.0\" y=\"358.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">to a baseline</text></g><path d=\"M300 330 L345 330\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"345\" y=\"280\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"328.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Register</text><text x=\"480.0\" y=\"358.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a model version</text></g><path d=\"M615 330 L660 330\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"660\" y=\"280\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\"/><text x=\"795.0\" y=\"328.0\" font-size=\"26\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Deploy</text><text x=\"795.0\" y=\"358.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">as an endpoint</text></g><path d=\"M795 202 L795 255\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\"/><path d=\"M795 255 L165 255\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\"/><path d=\"M165 255 L165 280\" stroke=\"#6b7280\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ahg)\"/></g><g data-s=\"3\"><g><rect x=\"60\" y=\"395\" width=\"420\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"270.0\" y=\"416\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">not good enough? back to the data</text></g></g><g data-s=\"4\"><g><rect x=\"30\" y=\"450\" width=\"440\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"250.0\" y=\"493.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Online endpoint</text><text x=\"250.0\" y=\"523.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">answers over HTTPS, now</text></g><g><rect x=\"490\" y=\"450\" width=\"440\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"710.0\" y=\"493.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Batch endpoint</text><text x=\"710.0\" y=\"523.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">big jobs, answered later</text></g></g>"}, {"title": "Other managed routes for training and serving", "narr": ["A team does not want to run training machines. Foundry fine-tuning trains a supported model on infrastructure Foundry manages. Which method and model work depends on the table for that model.", "Foundry Managed Compute serves chosen open models on dedicated GPUs, billed hourly. It is Preview, has no SLA and is not recommended for production. Do not confuse it with Azure ML compute.", "Teams that already live in Databricks or Fabric can train and score models next to their data. Fabric works on OneLake and feeds Power BI. Databricks adds MLflow and Unity Catalog governance.", "Ray is an open-source tool for spreading Python and AI work across machines. Anyscale on Azure manages the Ray clusters. Anyscale runs the control plane, and your workers run on AKS in your subscription.", "These overlap. The data you already hold and the team you have usually decide, more than the notebook. Next problem: you need the GPU machine itself."], "say": ["A team does not want training machines. Foundry fine-tuning trains a supported model on infrastructure Foundry runs.", "Managed Compute serves open models on dedicated GPUs, billed hourly. It is Preview with no SLA. Not for production.", "A team already in Databricks or Fabric trains next to its data.", "Ray spreads Python work across machines. Anyscale manages the clusters. The workers run in your own subscription.", "These overlap. The data you hold and the team you have usually decide. Next problem: you need the GPU machine itself."], "aud": {"exec": "Several managed routes exist between a hosted API and your own machines. Pick the one that matches your data and team.", "sec": "Anyscale shares responsibility: its control plane, your data plane. Read the responsibility matrix, do not assume it is all outsourced.", "ops": "Managed Compute has its own quota process. Existing Azure VM quota does not apply."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"90\" width=\"440\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"250.0\" y=\"163.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Foundry fine-tuning</text><text x=\"250.0\" y=\"193.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">supported models; no training GPUs to run</text></g><g><rect x=\"40\" y=\"100\" width=\"99\" height=\"32\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"89.5\" y=\"119\" font-size=\"18\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">managed</text></g></g><g data-s=\"1\"><g><rect x=\"490\" y=\"90\" width=\"440\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"710.0\" y=\"163.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Foundry Managed Compute</text><text x=\"710.0\" y=\"193.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">hourly GPU for open models</text></g><g><rect x=\"500\" y=\"100\" width=\"186\" height=\"32\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"593.0\" y=\"119\" font-size=\"18\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Preview, no SLA</text></g></g><g data-s=\"2\"><g><rect x=\"30\" y=\"270\" width=\"440\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"250.0\" y=\"343.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Databricks or Fabric</text><text x=\"250.0\" y=\"373.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">build ML next to your data</text></g></g><g data-s=\"3\"><g><rect x=\"490\" y=\"270\" width=\"440\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"710.0\" y=\"343.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Anyscale on Azure</text><text x=\"710.0\" y=\"373.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">managed Ray; workers in your AKS</text></g></g><text x=\"480\" y=\"470\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"4\">The data and the team usually decide.</text>"}, {"title": "When you need the GPU itself: VM families", "narr": ["Some teams want the machine itself. Azure sells GPU virtual machines in families. ND is for large training and high-volume inference. NC is for applied AI, batch inference and development. NV is for visualisation and virtual desktops, not usual AI training.", "The exact size matters. ND H100 v5 has eight H100 GPUs, each with its own 400 Gbps InfiniBand link.", "ND H200 v5 has eight H200 GPUs, with 141 GB of memory each.", "ND GB200 and GB300 v6 have four Blackwell GPUs per VM, deployed in rack-scale NVL72 configurations. They do not support Live Migration, Memory Preserving Updates, Service Healing or Nested Virtualization, so plan for failure yourself.", "NVv3 and NVv4 retired on 30 September 2026.", "Do not guess multi-node ability from a family name. Check the exact size for GPU count, interconnect and scale-out support. Next problem: you already run containers on Kubernetes."], "say": ["Some teams want the machine itself. ND is for big training. NC is for batch and development. NV is for graphics.", "ND H100 v5 has eight H100 GPUs. Each has its own 400 gigabit InfiniBand link.", "ND H200 v5 has eight H200 GPUs with 141 gigabytes each.", "GB200 and GB300 machines have four GPUs and cannot be live-migrated. I plan for failure myself.", "NVv3 and NVv4 retired on 30 September 2026.", "Check the exact size. A family name does not tell you the network or the scale-out ability. Next problem: you already run containers on Kubernetes."], "aud": {"exec": "Owning the machines buys control of the hardware and takes on the work of running it.", "sec": "You manage images, drivers and patching. Some families cannot be live-migrated, so maintenance can interrupt jobs.", "ops": "Confirm the size is offered in your region and that you hold the quota for that family."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"90\" width=\"290\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"175.0\" y=\"143.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">ND</text><text x=\"175.0\" y=\"173.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">training, big inference</text></g><g><rect x=\"335\" y=\"90\" width=\"290\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"143.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">NC</text><text x=\"480.0\" y=\"173.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">batch and dev work</text></g><g><rect x=\"640\" y=\"90\" width=\"290\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"143.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">NV</text><text x=\"785.0\" y=\"173.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">visualisation, desktops</text></g></g><g data-s=\"1\"><rect x=\"30\" y=\"230\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"270\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">ND H100 v5: 8 H100 GPUs, 400 Gbps InfiniBand for each GPU</text></g><g data-s=\"2\"><rect x=\"30\" y=\"310\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"350\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">ND H200 v5: 8 H200 GPUs with 141 GB each</text></g><g data-s=\"3\"><rect x=\"30\" y=\"390\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\"/><text x=\"480\" y=\"430\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">ND GB200/GB300 v6: 4 GPUs per VM; no Live Migration or Service Healing</text></g><g data-s=\"4\"><rect x=\"30\" y=\"470\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#6b7280\" stroke-width=\"3\" stroke-dasharray=\"8 6\"/><text x=\"480\" y=\"510\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"700\">NVv3 and NVv4 retired on 30 September 2026</text></g><text x=\"480\" y=\"568\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Check the exact size, not the family name.</text>"}, {"title": "Kubernetes with GPUs: AKS and KAITO", "narr": ["A team already runs containers on Kubernetes and wants GPUs in the same place. In Azure that is AKS, with a GPU node pool.", "You cannot add a GPU VM size to an existing general-purpose pool. Create a new pool.", "AKS installs the NVIDIA driver by default. If you use the NVIDIA GPU Operator, turn AKS driver installation off so the two do not fight.", "AKS also has a fully managed GPU stack (driver, plugin, metrics, health signals). It is Preview, outside the AKS SLA and not for production.", "KAITO is an AKS add-on for serving models. You write a workspace spec. Karpenter adds GPU nodes, vLLM runs the model, and your app gets an OpenAI-style API. vLLM and Triton are open-source engines, not Azure services.", "Removing a workspace does not delete the GPU nodes it created. You delete them yourself.", "The Learn guide gives KAITO no GA or Preview label. Confirm its status before calling it production-ready. Next problem: your code must spread across many machines."], "say": ["A team already runs containers on Kubernetes and wants GPUs there. That is AKS with a GPU node pool.", "You cannot add a GPU size to an existing pool. Make a new pool.", "AKS installs the NVIDIA driver by default. Using the GPU Operator? Turn that off.", "The fully managed GPU stack is Preview. Outside the SLA, not for production.", "KAITO takes a spec, adds GPU nodes, runs vLLM, and gives your app an OpenAI-style API.", "Removing a workspace does not remove the GPU nodes. You delete them.", "The docs give KAITO no status label. Confirm before calling it production-ready. Next problem: your code must spread across many machines."], "aud": {"exec": "Best when many teams share one container platform for training and serving.", "sec": "Pick managed or self-managed GPU stack and write down who owns the driver and patching. Time-slicing gives no hardware isolation.", "ops": "AKS node images for Azure Linux 2.0 were scheduled for removal on 31 Oct 2026. Use a supported OS image."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"90\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"165.0\" y=\"138.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">AKS cluster</text><text x=\"165.0\" y=\"168.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">containers + scaling</text></g><path d=\"M300 140 L345 140\" stroke=\"#111111\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"345\" y=\"90\" width=\"270\" height=\"100\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"138.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">GPU node pool</text><text x=\"480.0\" y=
