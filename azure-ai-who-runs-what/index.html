\"168.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">GPU VMs inside</text></g></g><g data-s=\"1\"><g><rect x=\"640\" y=\"105\" width=\"288\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"784.0\" y=\"127\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">new pool, never added</text></g><g><rect x=\"640\" y=\"145\" width=\"263\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"771.5\" y=\"167\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">to an existing pool</text></g></g><g data-s=\"2\"><rect x=\"30\" y=\"215\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"255\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Driver: AKS installs by default. With GPU Operator, turn that off.</text></g><g data-s=\"3\"><g><rect x=\"30\" y=\"295\" width=\"427\" height=\"35\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"243.5\" y=\"317\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Preview: fully managed GPU stack</text></g></g><g data-s=\"4\"><g><rect x=\"30\" y=\"350\" width=\"170\" height=\"80\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"115.0\" y=\"388.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Workspace</text><text x=\"115.0\" y=\"418.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a spec</text></g><path d=\"M200 390 L235 390\" stroke=\"#111111\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"235\" y=\"350\" width=\"170\" height=\"80\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"320.0\" y=\"388.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Karpenter</text><text x=\"320.0\" y=\"418.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">adds GPU nodes</text></g><path d=\"M405 390 L440 390\" stroke=\"#111111\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"440\" y=\"350\" width=\"170\" height=\"80\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"525.0\" y=\"388.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">vLLM</text><text x=\"525.0\" y=\"418.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">runs the model</text></g><path d=\"M610 390 L645 390\" stroke=\"#111111\" stroke-width=\"3\" fill=\"none\" marker-end=\"url(#ah)\"/><g><rect x=\"645\" y=\"350\" width=\"285\" height=\"80\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"787.5\" y=\"388.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">OpenAI-style API</text><text x=\"787.5\" y=\"418.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">for your app</text></g></g><g data-s=\"5\"><text x=\"480\" y=\"475\" font-size=\"21\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Removing a workspace leaves its GPU pool until you delete it.</text></g><g data-s=\"6\"><text x=\"480\" y=\"515\" font-size=\"21\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"700\">The docs give KAITO no GA or Preview label. Confirm first.</text></g>"}, {"title": "Ray: three ways to run it", "narr": ["A team has code that must spread across many machines. Ray is the open-source tool for that. It does training, batch inference and serving.", "Path one: open-source Ray with KubeRay and Kueue, set up from Microsoft's Terraform guide. Your team runs the operators, images and upgrades. Software you deploy this way is outside AKS SLAs and Azure support.", "Path two: the managed KubeRay extension. AKS runs the operator. It is Preview, outside the SLA and not for production.", "Path three: Anyscale on Azure. It is a separate integration. Anyscale runs the control plane. You own the application and the Azure resources in your subscription.", "KubeRay is the piece that manages Ray on Kubernetes. Kueue decides which queued jobs may start.", "Running Ray on AKS does not make the whole stack Microsoft-managed. Read each path's support terms. Next problem: you want to train across many machines, or serve one model per GPU."], "say": ["A team has work that must spread across many machines. Ray is the open-source tool for that.", "Path one: run it yourself with KubeRay and Kueue. You operate everything.", "Path two: the managed KubeRay extension. It is Preview. Not for production.", "Path three: Anyscale. They run the control plane. You own your application and your Azure resources.", "KubeRay manages Ray on Kubernetes. Kueue decides which queued jobs may start.", "Running Ray on AKS does not make it a Microsoft service. Read each path's support terms. Next problem: you want to train across many machines, or serve one model per GPU."], "aud": {"exec": "Three ways to run the same open-source engine, with three different splits of who does the work.", "sec": "Anyscale's responsibility matrix shows what stays with you: AKS, storage, network and access.", "ops": "Anyscale charges are separate from the Azure resources you also pay for. Check regions and limits."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><text x=\"480\" y=\"90\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Ray spreads Python and AI work across many machines</text></g><g data-s=\"1\"><rect x=\"30\" y=\"120\" width=\"900\" height=\"70\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"155\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">KubeRay + Kueue</text><text x=\"330\" y=\"155\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">open source on AKS</text><text x=\"700\" y=\"155\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">you operate it</text></g><g data-s=\"2\"><rect x=\"30\" y=\"210\" width=\"900\" height=\"70\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"245\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Managed KubeRay</text><text x=\"330\" y=\"245\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">AKS runs the operator</text><text x=\"700\" y=\"245\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">Preview</text></g><g data-s=\"3\"><rect x=\"30\" y=\"300\" width=\"900\" height=\"70\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"335\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Anyscale on Azure</text><text x=\"330\" y=\"335\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">their control plane</text><text x=\"700\" y=\"335\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">shared duty</text></g><g data-s=\"4\"><text x=\"480\" y=\"430\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">KubeRay runs Ray on Kubernetes. Kueue queues jobs.</text></g><g data-s=\"5\"><text x=\"480\" y=\"470\" font-size=\"22\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">None of these is a plain Microsoft-managed Ray service.</text></g>"}, {"title": "Training clusters and serverless GPUs", "narr": ["A team trains across many machines. Azure Batch is a scheduler offered as a service. It takes independent tasks and tightly coupled multi-node jobs, with no charge beyond the VMs, storage and networking.", "Azure CycleCloud is not a scheduler. It builds and scales the cluster, and you run the scheduler yourself (Slurm, PBS Pro, LSF and others).", "CycleCloud Workspace for Slurm is a Marketplace bundle that deploys CycleCloud, Slurm, networking and storage together.", "For serving a model on one GPU, Container Apps serverless GPUs scale to zero and bill per second.", "The limits: workload-profile environments only, A100 and T4 GPUs, A100 in selected regions, one GPU per replica, and image start-up time can dominate cold starts. Deploying Foundry models there is Preview.", "Choose by what you want to operate. Using Slurm alone is not a reason for CycleCloud, and avoiding VMs alone is not a reason for Batch. Next problem: storage can leave your GPUs idle."], "say": ["A team trains across many machines. Batch is a scheduler as a service. No fee beyond the machines.", "CycleCloud builds the cluster. You run the scheduler yourself.", "Workspace for Slurm bundles CycleCloud, Slurm, network and storage.", "To serve one model on one GPU, serverless GPUs scale to zero and bill per second.", "Limits: A100 and T4 only, one GPU per replica, and a big image means a slow cold start.", "Choose by what you want to operate. Say why in writing. Next problem: storage can leave your GPUs idle."], "aud": {"exec": "Pick between a hired scheduler (Batch), a built cluster (CycleCloud) and pay-per-second GPUs for small models.", "sec": "Each option moves who patches and who owns access. Write down which layer your team owns.", "ops": "Calculate peak quota before production. Artifact streaming needs Container Registry Premium."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"90\" width=\"290\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"175.0\" y=\"153.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Azure Batch</text><text x=\"175.0\" y=\"183.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">scheduler as a service</text></g><text x=\"175\" y=\"250\" font-size=\"18\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">No extra fee beyond VMs</text></g><g data-s=\"1\"><g><rect x=\"335\" y=\"90\" width=\"290\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480.0\" y=\"153.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">CycleCloud</text><text x=\"480.0\" y=\"183.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">builds the cluster</text></g><text x=\"480\" y=\"250\" font-size=\"18\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">You run the scheduler</text></g><g data-s=\"2\"><g><rect x=\"640\" y=\"90\" width=\"290\" height=\"130\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"785.0\" y=\"153.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Workspace for Slurm</text><text x=\"785.0\" y=\"183.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">a Marketplace bundle</text></g><text x=\"785\" y=\"250\" font-size=\"18\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">CycleCloud + Slurm + storage</text></g><g data-s=\"3\"><g><rect x=\"30\" y=\"320\" width=\"440\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"250.0\" y=\"373.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Container Apps serverless GPU</text><text x=\"250.0\" y=\"403.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">scales to zero; per-second billing</text></g></g><g data-s=\"4\"><rect x=\"490\" y=\"320\" width=\"440\" height=\"200\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"510\" y=\"360\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\"><tspan x=\"510\" dy=\"0\">A100 and T4 only</tspan><tspan x=\"510\" dy=\"36\">One GPU per replica</tspan><tspan x=\"510\" dy=\"36\">A100 in some regions</tspan><tspan x=\"510\" dy=\"36\">Slow image = slow cold start</tspan></text></g><text x=\"480\" y=\"568\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Choose by what you want to operate.</text>"}, {"title": "Feed the GPUs: storage for training", "narr": ["A training job reads data and writes checkpoints (saved copies of progress) all day. Storage can slow the GPUs.", "Azure Managed Lustre is a hot, parallel file system for training data and checkpoints, with import and export to Blob. Microsoft's guidance picks it for the lowest transfer times.", "Azure NetApp Files suits teams that need its enterprise features, tuning control, or already own NetApp.", "Local NVMe is fast scratch space on VMs that have it. It is ephemeral, so copy or checkpoint anything you want to keep.", "Blob Storage with NFS 3.0 suits read-heavy, sequential access. It is not for transactional work or in-place edits.", "The trade-offs for NFS 3.0: traffic must come from a virtual network, it supports no account key, Entra ID or ACL authorization, and no rename or links. It needs a hierarchical namespace, which does not support Blob versioning. Next problem: can you actually get the GPUs?"], "say": ["A training job reads data and saves checkpoints all day. Slow storage means idle GPUs.", "Managed Lustre is hot, parallel storage. Microsoft's guidance picks it for the lowest transfer times.", "NetApp Files fits teams that want its features or already own it.", "Local NVMe is fast scratch. It is temporary, so copy anything you keep.", "Blob over NFS fits read-heavy, sequential work. Not for edits in place.", "The cost: network-only access, no Entra or ACL authorization, and no Blob versioning. Next problem: can you actually get the GPUs?"], "aud": {"exec": "Storage speed decides how busy your expensive GPUs stay.", "sec": "NFS 3.0 on Blob cannot use Entra ID or ACLs. Control access through the network.", "ops": "Save checkpoints regularly and move cold data to Blob. Check the versioning support matrix before combining features."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><text x=\"480\" y=\"90\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Training moves a lot of data through storage</text></g><g data-s=\"1\"><rect x=\"30\" y=\"115\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"150\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Managed Lustre</text><text x=\"330\" y=\"150\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">hot, parallel; checkpoints</text><text x=\"700\" y=\"150\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">fastest</text></g><g data-s=\"2\"><rect x=\"30\" y=\"195\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"230\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">NetApp Files</text><text x=\"330\" y=\"230\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">enterprise features</text><text x=\"700\" y=\"230\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">tuning control</text></g><g data-s=\"3\"><rect x=\"30\" y=\"275\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"310\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Local NVMe</text><text x=\"330\" y=\"310\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">temporary scratch</text><text x=\"700\" y=\"310\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">ephemeral</text></g><g data-s=\"4\"><rect x=\"30\" y=\"355\" width=\"900\" height=\"64\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"50\" y=\"390\" font-size=\"24\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"700\">Blob NFS 3.0</text><text x=\"330\" y=\"390\" font-size=\"22\" fill=\"#6b7280\" text-anchor=\"start\" font-weight=\"400\">read-heavy, sequential</text><text x=\"700\" y=\"390\" font-size=\"22\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\">VNet only</text></g><g data-s=\"5\"><rect x=\"30\" y=\"445\" width=\"900\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"480\" y=\"483\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Blob NFS 3.0: no Entra ID or ACL authorization, no rename or links.</text><text x=\"480\" y=\"515\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">It needs a hierarchical namespace, so Blob versioning is out.</text></g>"}, {"title": "Quota is not capacity", "narr": ["A team picks a GPU size. Two things have to be true. Quota is permission to use that VM family in a region. Capacity is real machines available when you ask.", "Quota approved does not mean capacity. You can hold quota and still be unable to start the machines.", "An on-demand capacity reservation secures capacity with an SLA for supported sizes. It needs quota, and you pay the VM rate even when it sits unused.", "Support varies by series. The current docs list NC A100 v4 and several NV series as supported, and exclude the ND series and NCads H100 v5.", "Reserved Instances lower the price. They do not guarantee capacity.", "For large ND capacity, talk to your Microsoft account team early. Next problem: which rung of the ladder is right for you?"], "say": ["A team picks a GPU size. Two things must be true. Quota is permission. Capacity is real machines.", "Quota approved does not mean machines are waiting.", "A capacity reservation secures machines with an SLA. You pay for it even when unused.", "Support varies by series. ND and NCads H100 v5 are not on the current list.", "Reserved Instances lower the price. They do not guarantee capacity.", "For big ND capacity, talk to your Microsoft account team early. Next problem: which rung of the ladder is right for you?"], "aud": {"exec": "Plan for lead time. A budget line and an approved quota do not put GPUs in your hands.", "sec": "Not a security topic. Keep quota requests inside normal change control.", "ops": "Quota is per subscription, per region, at total vCPU and VM-family level. Some increases need a support request."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><g><rect x=\"30\" y=\"100\" width=\"420\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"240.0\" y=\"158.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Quota</text><text x=\"240.0\" y=\"188.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">permission to use a size</text></g><g><rect x=\"510\" y=\"100\" width=\"420\" height=\"120\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"720.0\" y=\"158.0\" font-size=\"26\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Capacity</text><text x=\"720.0\" y=\"188.0\" font-size=\"20\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">real GPUs in a data centre</text></g></g><g data-s=\"1\"><text x=\"480\" y=\"270\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Quota approved does not mean GPUs are waiting.</text></g><g data-s=\"2\"><rect x=\"30\" y=\"300\" width=\"900\" height=\"110\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"480\" y=\"340\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Capacity reservation: secures capacity, with an SLA</text><text x=\"480\" y=\"375\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"400\">Needs quota. Billed at the VM rate even when unused.</text></g><g data-s=\"3\"><g><rect x=\"30\" y=\"430\" width=\"672\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"366.0\" y=\"451\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Not for ND series or NCads H100 v5 (docs, 29 Oct 2026)</text></g></g><g data-s=\"4\"><g><rect x=\"30\" y=\"475\" width=\"552\" height=\"34\" rx=\"8\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"2\"/><text x=\"306.0\" y=\"496\" font-size=\"20\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Reserved Instances: a discount, no guarantee</text></g></g><text x=\"480\" y=\"568\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\" data-s=\"5\">Ask your Microsoft account team early for big ND capacity.</text>"}, {"title": "Choose by who runs what", "narr": ["The series is one ladder. At the bottom is a hosted model API. Someone else runs everything and you call it.", "One step up, you build a platform around the model: agents, search and safety checks.", "Next, managed ML. You own the model and its life cycle while the platform runs the machines.", "At the top, you own the infrastructure: machines, Kubernetes, GPUs, storage and quota.", "Each step up gives more control and takes on more work. Start as low as the job allows.", "Before you commit, ask: which layer will we operate, and why? Which exact size and region, and do we hold the quota? Who owns drivers, images and upgrades? Next problem: many of these services are Preview or retiring."], "say": ["The series is one ladder. At the bottom, a hosted model API. Someone else runs everything.", "One step up, you build a platform around the model: agents, search and checks.", "Next, managed ML. You own the model. The platform runs the machines.", "At the top, you own the infrastructure: machines, Kubernetes, GPUs, storage and quota.", "Each step up gives more control and more work. Start as low as the job allows.", "Ask one question first: which layer will we operate, and why? Next problem: many of these services are Preview or retiring."], "aud": {"exec": "Start with the lowest rung that does the job. Move up only when testing shows a problem you cannot fix lower down.", "sec": "Every rung up moves another duty onto your team: patching, access, data location, monitoring.", "ops": "Before production name owners for access, cost and operations, and agree a measurable acceptance test."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><rect x=\"30\" y=\"400\" width=\"210\" height=\"90\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"135\" y=\"440\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Hosted API</text><text x=\"135\" y=\"470\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">they run it</text></g><g data-s=\"1\"><rect x=\"260\" y=\"340\" width=\"210\" height=\"150\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"365\" y=\"390\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Platform</text><text x=\"365\" y=\"424\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">agents, search,</text><text x=\"365\" y=\"448\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">safety</text></g><g data-s=\"2\"><rect x=\"490\" y=\"280\" width=\"210\" height=\"210\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"595\" y=\"340\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Managed ML</text><text x=\"595\" y=\"374\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">train, serve,</text><text x=\"595\" y=\"398\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">fine-tune</text></g><g data-s=\"3\"><rect x=\"720\" y=\"210\" width=\"210\" height=\"280\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\"/><text x=\"825\" y=\"280\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Your</text><text x=\"825\" y=\"312\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">infrastructure</text><text x=\"825\" y=\"350\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">VMs, AKS,</text><text x=\"825\" y=\"374\" font-size=\"19\" fill=\"#6b7280\" text-anchor=\"middle\" font-weight=\"400\">GPUs, quota</text></g><g data-s=\"4\"><text x=\"480\" y=\"110\" font-size=\"28\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">More control, more work for your team</text><path d=\"M120 160 L840 160\" stroke=\"#d71f26\" stroke-width=\"5\" fill=\"none\" marker-end=\"url(#ahr)\"/></g><g data-s=\"5\"><text x=\"480\" y=\"535\" font-size=\"22\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\"><tspan x=\"480\" dy=\"0\">Which layer will your team operate, and why?</tspan><tspan x=\"480\" dy=\"32\">Which exact size and region, and do you hold the quota?</tspan></text></g>"}, {"title": "Watch list: Preview and retiring", "narr": ["One more thing to carry out of the series: a watch list. Many options are labelled Preview, which means no SLA and not recommended for production.", "The Preview list in the series: Foundry Managed Compute, interactive training, LoRA adapters on Fireworks, agentic retrieval, the AKS managed GPU stack, managed KubeRay, and deploying Foundry models to Container Apps.", "Dates: NVv3 and NVv4 retired on 30 September 2026. Azure Linux 2.0 node images on AKS were scheduled for removal on 31 October 2026. Prompt Flow retires on 20 April 2027, and some Content Safety previews on 30 April 2027.", "The author checked all five parts on 29 October 2026. Labels and dates change, so check Microsoft Learn before you decide."], "say": ["One more thing to carry out: a watch list. Preview means no SLA and not for production.", "In this series that covers Managed Compute, interactive training, LoRA on Fireworks, agentic retrieval, the AKS managed GPU stack and managed KubeRay.", "Dates: two VM series retired on 30 September. Prompt Flow retires 20 April 2027. Some Content Safety previews retire 30 April 2027.", "The author checked all this on 29 October 2026. Check Microsoft Learn again before you decide."], "aud": {"exec": "A neat way to avoid surprises: read the lifecycle label for every service in a design.", "sec": "Preview features come without SLAs and with limits. Do not present them as guardrails.", "ops": "Put each date in a calendar. Review the list again before any production release."}, "svg": "<defs><marker id=\"ah\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#111111\"/></marker><marker id=\"ahr\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#d71f26\"/></marker><marker id=\"ahg\" markerUnits=\"userSpaceOnUse\" markerWidth=\"18\" markerHeight=\"18\" refX=\"15\" refY=\"9\" orient=\"auto\"><path d=\"M0 0 L16 9 L0 18 Z\" fill=\"#6b7280\"/></marker></defs><g data-s=\"0\"><text x=\"480\" y=\"80\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Preview, retiring or retired (as checked 29 Oct 2026)</text></g><g data-s=\"1\"><rect x=\"30\" y=\"105\" width=\"440\" height=\"310\" rx=\"14\" fill=\"#fff\" stroke=\"#d71f26\" stroke-width=\"4\" stroke-dasharray=\"10 8\"/><text x=\"250\" y=\"145\" font-size=\"24\" fill=\"#d71f26\" text-anchor=\"middle\" font-weight=\"700\">Preview: no SLA</text><text x=\"52\" y=\"190\" font-size=\"19\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\"><tspan x=\"52\" dy=\"0\">Foundry Managed Compute</tspan><tspan x=\"52\" dy=\"32\">Interactive training</tspan><tspan x=\"52\" dy=\"32\">LoRA on Fireworks</tspan><tspan x=\"52\" dy=\"32\">Agentic retrieval</tspan><tspan x=\"52\" dy=\"32\">AKS managed GPU stack</tspan><tspan x=\"52\" dy=\"32\">Managed KubeRay</tspan><tspan x=\"52\" dy=\"32\">Foundry models on Container Apps</tspan></text></g><g data-s=\"2\"><rect x=\"490\" y=\"105\" width=\"440\" height=\"310\" rx=\"14\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"4\"/><text x=\"710\" y=\"145\" font-size=\"24\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Dates to remember</text><text x=\"512\" y=\"190\" font-size=\"19\" fill=\"#111111\" text-anchor=\"start\" font-weight=\"400\"><tspan x=\"512\" dy=\"0\">NVv3, NVv4: retired 30 Sep 2026</tspan><tspan x=\"512\" dy=\"32\">Azure Linux 2.0 node images:</tspan><tspan x=\"512\" dy=\"32\">   removal set for 31 Oct 2026</tspan><tspan x=\"512\" dy=\"32\">Prompt Flow: retires 20 Apr 2027</tspan><tspan x=\"512\" dy=\"32\">Some Content Safety previews:</tspan><tspan x=\"512\" dy=\"32\">   retire 30 Apr 2027</tspan></text></g><g data-s=\"3\"><rect x=\"30\" y=\"440\" width=\"900\" height=\"90\" rx=\"12\" fill=\"#fff\" stroke=\"#111111\" stroke-width=\"3\"/><text x=\"480\" y=\"478\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Published on the Startups at Microsoft blog, 30 Oct 2026.</text><text x=\"480\" y=\"510\" font-size=\"21\" fill=\"#111111\" text-anchor=\"middle\" font-weight=\"700\">Re-check each item in Microsoft Learn before you decide.</text></g>"}];

const QUIZ = {kind:'quiz', title:'Rehearse the room', narr:['Quiz']};
const SC = [INTRO].concat(PY).concat([QUIZ]);
const QS = [["A manager says: \"It is just an API, so Microsoft runs the model.\"", "What do you say?", ["An API tells you nothing about who runs the model. I ask who operates it.", "An API always means Microsoft runs it.", "An API means your team trains the model."], 0, "The API is only the doorway. Microsoft, a partner or your own team can sit behind it."], ["Policy changes every month and the model must answer from it.", "Which tool fits first?", ["Train a new model from scratch", "Fine-tune the model every month", "Retrieval: paste the right policy text into the request"], 2, "Retrieval supplies a changing fact. Fine-tuning changes habits and format, and it is not guaranteed to help."], ["Legal says customer data must be processed in the EU.", "Which deployment types are candidates?", ["Developer", "Data Zone Standard or Standard", "Global Standard"], 1, "Global can process in any Azure region. Data Zone and Standard limit where processing happens. The resource region alone does not decide it."], ["A teammate says Fireworks on Foundry is fully covered by Microsoft guarantees.", "What is a fair reply?", ["Yes, it is part of Foundry so everything is covered", "No. Data is shared with Fireworks, it is outside the EU Data Boundary, and Microsoft does not test the model's safety.", "Only the logo is different"], 1, "The integration is GA, but the runtime and data handling belong to Fireworks, and some features are Preview."], ["The agent needs to answer from private documents.", "What also has to happen?", ["Turn on Prompt Shields and stop there", "Nothing, search handles permissions", "Enforce who may see which document separately"], 2, "Retrieval finds text. It does not authorize it. Prompt Shields do not judge accuracy."], ["Your quota for an ND size was approved.", "What do you know about getting the GPUs?", ["Nothing yet. Quota is permission, not capacity.", "You are billed for them already", "They are reserved for you"], 0, "Capacity reservations can secure machines, but the docs checked on 29 Oct exclude ND series from them."], ["Someone wants to run a production service on Foundry Managed Compute.", "What do you say?", ["It is Preview with no SLA and not recommended for production.", "It is the standard production path.", "It replaces Azure ML compute."], 0, "Managed Compute is Preview. It is also separate from Azure ML compute."]];
let si=0, bi=0, timer=null;
const $=id=>document.getElementById(id);
const stage=$('stage');
function drawer(){const l=$('list');l.innerHTML='';SC.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i===0?'Start':i===SC.length-1?'Quiz':i+'. ')+(i>0&&i<SC.length-1?s.title:'');if(i===si)b.className='cur';b.onclick=()=>{go(i,0);$('drawer').classList.remove('open')};l.appendChild(b)})}
function parseP(v,b){let best=[0,0];v.split(';').forEach(p=>{const [k,xy]=p.split(':');if(+k<=b){const [x,y]=xy.split(',');best=[+x,+y]}});return best}
function apply(b){
  const svg=stage.querySelector('svg'); if(!svg) return;
  svg.querySelectorAll('[data-s],[data-e],[data-c],[data-p]').forEach(el=>{
    const s=el.dataset.s,e=el.dataset.e;let vis=true;
    if(s!==undefined&&b<+s)vis=false; if(e!==undefined&&b>=+e)vis=false;
    el.classList.toggle('off',!vis);
    if(el.dataset.c){const pairs=el.dataset.c.split(',').map(x=>x.split(':'));const all=new Set();pairs.forEach(p=>(p[1]||'').split(' ').forEach(c=>c&&all.add(c)));all.forEach(c=>el.classList.remove(c));let cur='';pairs.forEach(p=>{if(+p[0]<=b)cur=p[1]||''});cur.split(' ').forEach(c=>c&&el.classList.add(c))}
    if(el.dataset.p){const [x,y]=parseP(el.dataset.p,b);el.style.transform=`translate(${x}px,${y}px)`}
  });
}
function introHTML(){return `<div class="card"><h2>AI on Azure: who runs what</h2><p>This walks through Microsoft's five-part "AI on Azure" series (30 Oct 2026) from the bottom up. One fictional support app. One new idea per step.</p><p>Each step has a small animation, a plain explanation and a red box with the words to say. Labels such as Preview come from the series, checked by its author on 29 Oct 2026.</p><ol>${PY.map(s=>`<li>${s.title}</li>`).join('')}</ol></div>`}
function quizHTML(){let h='<div id="qz">';QS.forEach((q,i)=>{h+=`<div class="q" data-i="${i}"><div class="cue">${q[0]}</div><div>${q[1]}</div>${q[2].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<div class="why">${q[4]}</div></div>`});h+='<div class="score" id="score"></div></div>';return h}
function go(s,b){clearInterval(timer);timer=null;$('auto').textContent='Auto';si=Math.max(0,Math.min(SC.length-1,s));const sc=SC[si];bi=Math.max(0,Math.min(sc.narr.length-1,b));build();}
function build(){
  const sc=SC[si];
  $('kick').textContent=si===0?'Start':si===SC.length-1?'Quiz':`Step ${si} of ${SC.length-2}`;
  $('title').textContent=sc.title;
  $('prog').style.width=(si/(SC.length-1)*100)+'%';
  if(sc.kind==='intro'){stage.innerHTML=introHTML();$('narr').style.display='none';$('say').style.display='none';$('aud').style.display='none';$('aud').style.display='none'}
  else if(sc.kind==='quiz'){stage.innerHTML=quizHTML();$('narr').style.display='none';$('say').style.display='none';
    let right=0,done=0;stage.querySelectorAll('.q').forEach(q=>{const i=+q.dataset.i;q.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(q.classList.contains('done'))return;q.classList.add('done');const j=+o.dataset.j;done++;if(j===QS[i][3]){o.classList.add('right');right++}else{o.classList.add('wrong');q.querySelectorAll('.opt')[QS[i][3]].classList.add('right')}$('score').textContent=`${right} of ${QS.length} right`+(done===QS.length?(right===QS.length?'. You are ready for the room.':'. Go back to the steps you missed.'):'')})})}
  else{$('narr').style.display='block';$('say').style.display='';$('aud').style.display='';stage.innerHTML=`<svg viewBox="0 0 960 600" class="notrans">${sc.svg}</svg>`;apply(bi);void stage.offsetWidth;stage.querySelector('svg').classList.remove('notrans')}
  paint();
}
function paint(){
  const sc=SC[si];const n=sc.narr.length;
  if(sc.kind==='intro'||sc.kind==='quiz'){$('dots').innerHTML='';$('back').disabled=si===0;$('next').textContent=sc.kind==='quiz'?'Start again':(si===0?'Start':'Next');$('auto').style.display='none';return}
  $('auto').style.display='';
  $('lab').textContent=`Beat ${bi+1} of ${n}`;$('text').textContent=sc.narr[bi];$('saytext').textContent=(sc.say&&sc.say[bi])||'';$('audbody').innerHTML=sc.aud?`<div class=r><b>Executive</b>${sc.aud.exec}</div><div class=r><b>Security</b>${sc.aud.sec}</div><div class=r><b>Operations</b>${sc.aud.ops}</div>`:'';
  $('dots').innerHTML=sc.narr.map((_,i)=>`<b class="${i===bi?'on':i<bi?'done':''}" data-i="${i}"></b>`).join('');
  $('dots').querySelectorAll('b').forEach(b=>b.onclick=()=>{bi=+b.dataset.i;apply(bi);paint()});
  $('back').disabled=false;$('next').textContent=(bi===n-1&&si<SC.length-1)?'Next step':'Next';
}
function next(){const sc=SC[si];if(sc.kind==='quiz'){go(0,0);return}if(sc.kind==='intro'){go(1,0);return}if(bi<sc.narr.length-1){bi++;apply(bi);paint()}else go(si+1,0)}
function back(){const sc=SC[si];if(sc.kind==='intro'||sc.kind==='quiz'){go(si-1,SC[si-1].narr.length-1);return}if(bi>0){bi--;apply(bi);paint()}else if(si>0){go(si-1,SC[si-1].narr.length-1)}}
$('next').onclick=next;$('back').onclick=back;
$('auto').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('auto').textContent='Auto'}else{$('auto').textContent='Pause';timer=setInterval(()=>{const sc=SC[si];if(si>=SC.length-1){clearInterval(timer);timer=null;$('auto').textContent='Auto';return}next()},5500)}};
$('sayt').onclick=()=>{const o=$('say').classList.toggle('off');$('sayt').textContent=o?'Script: off':'Script: on'};
$('menu').onclick=()=>{drawer();$('drawer').classList.add('open')};$('close').onclick=()=>$('drawer').classList.remove('open');
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')back()});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70){d<0?next():back()}tx=null},{passive:true});
(function(){const m=location.hash.match(/s(\d+)b(\d+)/);if(m)go(+m[1],+m[2]);else go(0,0)})();
</script></body></html>
